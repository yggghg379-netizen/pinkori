<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinkori — Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111214; /* Dark game platform background */
      color: #ffffff;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: 24px 36px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #232527;
      background-color: #191b1d;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
      user-select: none;
    }

    /* Gray brand icon inspired by a game block */
    .logo-icon {
      width: 28px;
      height: 28px;
      background-color: #8e9297;
      border-radius: 6px;
      transform: rotate(-10deg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon::after {
      content: "";
      width: 8px;
      height: 8px;
      background-color: #191b1d;
      border-radius: 2px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .status-badge {
      background-color: #232527;
      color: #adb2b8;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 5vw, 54px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    p {
      color: #8e9297;
      font-size: 16px;
      max-width: 420px;
    }

    footer {
      padding: 20px 36px;
      text-align: center;
      font-size: 13px;
      color: #65686c;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 20px;
      }
      .logo {
        font-size: 22px;
      }
      main {
        padding: 28px 18px;
      }
      h1 {
        font-size: clamp(28px, 8vw, 40px);
        overflow-wrap: anywhere;
      }
      p {
        font-size: 15px;
      }
      footer {
        padding: 18px 16px;
        line-height: 1.5;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <span>PINKORI</span>
    </div>
  </header>

  <main>
    <div class="status-badge">Pinkori Studio</div>
    <h1>We're Launching Soon</h1>
    <p>The platform is in the final stages of launch. Get ready for new games and adventures!</p>
  </main>

  <footer>
    Terms and Conditions © 2026 Pinkori
  </footer>

</body>
</html>
